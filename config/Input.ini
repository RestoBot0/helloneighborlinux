; ===========================================================================
;  Hello Neighbor - Input.ini
;
;  Purpose:
;    1. Bind the UE4 developer console to BOTH  ~  and  F1
;    2. Kill mouse smoothing / acceleration (UE4 defaults make aiming at
;       door handles feel like wading through syrup, and it is worse under
;       Wine because the smoothing filter is frame-time based)
;
;  Note on the tilde key under ChromeOS:
;    Crostini apps receive keys through Sommelier/Wayland. On some layouts
;    the ~ keypress is swallowed before Wine sees it. That is exactly why
;    F1 is bound as a second console key -- if ~ does nothing, press F1.
; ===========================================================================

[/Script/Engine.InputSettings]
ConsoleKey=Tilde
+ConsoleKeys=Tilde
+ConsoleKeys=F1

; --- mouse feel ------------------------------------------------------------
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bEnableLegacyInputScales=False
bEnableFOVScaling=True
FOVScale=0.011110
DoubleClickTime=0.200000

; --- capture behaviour -----------------------------------------------------
; "CapturePermanently_IncludingInitialMouseDown" stops the cursor escaping
; the window on a multi-monitor / scaled ChromeOS desktop.
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bDefaultViewportMouseLock=True
bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=False
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True

; --- axis tuning -----------------------------------------------------------
; UE4 applies smoothing per-axis as well; zeroing the dead zones gives a
; 1:1 response that matches how the game feels on native Windows.
RawMouseInputEnabled=1
