; ===========================================================================
;  Hello Neighbor - Engine.ini
;  Tuned for: ChromeOS Crostini / Intel Iris Xe / 12th gen i5 / 8 GB RAM
;  Target:    stable 60+ FPS at 1280x720 (scales fine to 1600x900)
;
;  Installed to:
;    <prefix>/drive_c/users/<you>/AppData/Local/HelloNeighbor/
;        Saved/Config/WindowsNoEditor/Engine.ini
;
;  [SystemSettings] is applied at runtime and overrides the scalability
;  groups, so this is the authoritative section.
; ===========================================================================

[SystemSettings]

; --- resolution & upscaling ------------------------------------------------
; Render at 85% and upscale. On a 720p/900p window this is nearly invisible
; but buys roughly 25-30% GPU headroom, which is exactly what an iGPU behind
; VirGL needs. Drop to 75 if you still dip below 60.
r.ScreenPercentage=85
r.Upscale.Quality=2
r.Tonemapper.Sharpen=0.6
r.TonemapperQuality=1

; --- vsync / frame pacing --------------------------------------------------
; Compositor vsync inside Crostini causes a double-buffer stall. Turn the
; engine's vsync off and let ChromeOS present; much smoother in practice.
r.VSync=0
rhi.SyncInterval=0
t.MaxFPS=0
r.OneFrameThreadLag=1
r.FinishCurrentFrame=0

; --- shadows ---------------------------------------------------------------
; The single biggest cost in Hello Neighbor. The house has a lot of dynamic
; point lights; capping resolution and distance is where most of the frame
; time comes back.
r.ShadowQuality=2
r.Shadow.MaxResolution=512
r.Shadow.MaxCSMResolution=1024
r.Shadow.DistanceScale=0.55
r.Shadow.RadiusThreshold=0.06
r.Shadow.CSM.MaxCascades=2
r.Shadow.CSMDepthBias=12
r.Shadow.PerObject=1
r.Shadow.TransitionScale=60
r.LightFunctionQuality=0
r.ParticleLightQuality=0

; --- post processing -------------------------------------------------------
; Motion blur and DoF are pure cost with no gameplay value here; both off.
; Bloom stays (low) because the game's lighting reads badly without it.
r.DefaultFeature.MotionBlur=0
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.DefaultFeature.Bloom=1
r.BloomQuality=2
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.LightShaftQuality=0
r.Tonemapper.GrainQuantization=0
r.EyeAdaptationQuality=1
r.SeparateTranslucency=0
r.RefractionQuality=0
r.SSS.Scale=0
r.TranslucencyVolumeBlur=0
r.TranslucencyLightingVolumeDim=24

; --- reflections & AO ------------------------------------------------------
r.SSR.Quality=0
r.SSR.MaxRoughness=0.1
r.ReflectionEnvironment=1
r.AmbientOcclusionLevels=0
r.AmbientOcclusion.Compute=0
r.AmbientOcclusionMaxQuality=50

; --- anti-aliasing ---------------------------------------------------------
; 0=off 1=FXAA 2=TAA. FXAA is far cheaper than TAA and avoids the smeared
; ghosting TAA produces once you're upscaling from 85%.
r.DefaultFeature.AntiAliasing=1
r.PostProcessAAQuality=1

; --- textures & streaming --------------------------------------------------
; 8 GB shared between the VM and the iGPU: a 1024 MB pool is the sweet spot.
; Going higher starts swapping, which reads as random 2-second freezes.
r.Streaming.PoolSize=1024
r.Streaming.LimitPoolSizeToVRAM=0
r.Streaming.MaxTempMemoryAllowed=96
r.Streaming.FullyLoadUsedTextures=0
r.Streaming.HLODStrategy=2
r.Streaming.UseFixedPoolSize=0
r.MaxAnisotropy=4
r.TextureStreaming=1
r.CreateShadersOnLoad=1

; --- geometry / culling ----------------------------------------------------
; HZB occlusion avoids per-frame GPU occlusion queries, which stall hard on
; both DXVK and WineD3D. Keep it on.
r.HZBOcclusion=1
r.AllowOcclusionQueries=1
r.TriangleOrderOptimization=1
r.ViewDistanceScale=0.85
foliage.LODDistanceScale=0.7
r.SkeletalMeshLODBias=0

; --- threading -------------------------------------------------------------
; You have plenty of cores; async loading is what kills the hitching when the
; neighbour chases you between rooms.
r.RHICmdBypass=0
r.RHIThread.Enable=1
s.AsyncLoadingThreadEnabled=1
s.AsyncLoadingTimeLimit=8
s.PriorityAsyncLoadingExtraTime=20
s.LevelStreamingActorsUpdateTimeLimit=4
s.UnregisterComponentsTimeLimit=2
FX.BatchAsync=1
FX.EarlyScheduleAsync=1

; --- misc ------------------------------------------------------------------
r.Color.Max=1.0
; 'wf' = windowed-fullscreen (borderless). Do NOT use 'f' here: exclusive
; fullscreen mode-sets fail inside Crostini -> black screen with audio.
r.SetRes=1280x720wf


; ===========================================================================
;  DEVELOPER CONSOLE
;  Two keys bound so you have a fallback if ~ is eaten by the ChromeOS IME.
; ===========================================================================
[/Script/Engine.InputSettings]
ConsoleKey=Tilde
+ConsoleKeys=Tilde
+ConsoleKeys=F1
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bCaptureMouseOnLaunch=True
bAltEnterTogglesFullscreen=True

[/Script/Engine.Console]
MaxScrollbackSize=1024
HistoryBot=-1

[ConsoleVariables]
AllowConsoleInShipping=1
con.DebugEarlyDefault=1


; ===========================================================================
;  Renderer defaults (read at startup, before SystemSettings is applied)
; ===========================================================================
[/Script/Engine.RendererSettings]
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.DefaultFeature.AutoExposure=True
r.EarlyZPass=2
r.EarlyZPassMovable=True
r.CustomDepth=1


[/Script/Engine.GarbageCollectionSettings]
gc.TimeBetweenPurgingPendingKillObjects=90
gc.MaxObjectsNotConsideredByGC=1
gc.FlushStreamingOnGC=0


[Audio]
; Lower voice count: the Crostini audio bridge chokes above ~24 live voices
; and that shows up as stutter, not just audio glitching.
MaxChannels=24
