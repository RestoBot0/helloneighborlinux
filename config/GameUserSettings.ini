; ===========================================================================
;  Hello Neighbor - GameUserSettings.ini
;  This is what the in-game Options menu reads and writes.
;
;  FullscreenMode values:  0 = exclusive fullscreen
;                          1 = borderless windowed
;                          2 = windowed  <-- use this on Crostini
;
;  Borderless (1) was the setting here until Unreal's own crash report
;  showed the game had gone to exclusive fullscreen anyway and DXGI had
;  refused the swap chain. The game rewrites this file itself, so the .ini
;  alone cannot be trusted to hold a window mode -- the launcher also passes
;  -WINDOWED, which Unreal applies after the .ini and which the game cannot
;  overwrite.
;
;  Exclusive fullscreen asks Wine to perform a real display mode change.
;  Inside Crostini there is no real display to change, and the usual result
;  is a black screen with audio playing, or the game minimising the instant
;  it loses focus. Borderless windowed avoids the whole problem and costs
;  nothing measurable in frame time.
; ===========================================================================

[/Script/Engine.GameUserSettings]
bUseVSync=False
bUseDynamicResolution=False
ResolutionSizeX=1280
ResolutionSizeY=720
LastUserConfirmedResolutionSizeX=1280
LastUserConfirmedResolutionSizeY=720
WindowPosX=-1
WindowPosY=-1
FullscreenMode=2
LastConfirmedFullscreenMode=2
PreferredFullscreenMode=2
Version=5
AudioQualityLevel=0
FrameRateLimit=0.000000
DesiredScreenWidth=1280
DesiredScreenHeight=720
bUseDesiredScreenHeight=False
LastRecommendedScreenWidth=1280.000000
LastRecommendedScreenHeight=720.000000

; Set these to -1 so the engine does NOT run its hardware benchmark on first
; launch. The benchmark badly misreads virtualised GPUs and will happily
; stomp every setting below with "Epic".
LastCPUBenchmarkResult=-1.000000
LastGPUBenchmarkResult=-1.000000
LastGPUBenchmarkMultiplier=1.000000
bUseHDRDisplayOutput=False
HDRDisplayOutputNits=1000

[ScalabilityGroups]
sg.ResolutionQuality=85
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=1
sg.ShadowQuality=2
sg.PostProcessQuality=1
sg.TextureQuality=2
sg.EffectsQuality=1
sg.FoliageQuality=1
