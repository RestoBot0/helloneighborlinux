; ===========================================================================
;  Hello Neighbor - Scalability.ini
;  Adds a custom quality level 4 ("Crostini") and redefines level 1 so the
;  in-game Low/Medium presets stop undoing our tuning.
;
;  UE4 maps the in-game quality dropdown to sg.* groups. Hello Neighbor's
;  options menu writes those groups on every launch, which is why editing
;  only Engine.ini sometimes "doesn't stick" -- this file is the other half.
; ===========================================================================

[ScalabilitySettings]
PerfIndexThresholds_ResolutionQuality="GPU 18 42 105"
PerfIndexValues_ResolutionQuality="50 71 85 100"

; ---------------------------------------------------------------------------
; Resolution quality
; ---------------------------------------------------------------------------
[ResolutionQuality@0]
r.ScreenPercentage=50
[ResolutionQuality@1]
r.ScreenPercentage=71
[ResolutionQuality@2]
r.ScreenPercentage=85
[ResolutionQuality@3]
r.ScreenPercentage=100

; ---------------------------------------------------------------------------
; View distance
; ---------------------------------------------------------------------------
[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=2
r.ViewDistanceScale=0.4
foliage.LODDistanceScale=0.25
[ViewDistanceQuality@1]
r.SkeletalMeshLODBias=1
r.ViewDistanceScale=0.6
foliage.LODDistanceScale=0.45
[ViewDistanceQuality@2]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=0.85
foliage.LODDistanceScale=0.7
[ViewDistanceQuality@3]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0
foliage.LODDistanceScale=1.0

; ---------------------------------------------------------------------------
; Anti-aliasing  (1 = FXAA, cheap; 2+ = TAA, expensive + ghosty when upscaled)
; ---------------------------------------------------------------------------
[AntiAliasingQuality@0]
r.PostProcessAAQuality=0
[AntiAliasingQuality@1]
r.PostProcessAAQuality=1
[AntiAliasingQuality@2]
r.PostProcessAAQuality=1
[AntiAliasingQuality@3]
r.PostProcessAAQuality=2

; ---------------------------------------------------------------------------
; Shadows  -- the expensive one on an iGPU
; ---------------------------------------------------------------------------
[ShadowQuality@0]
r.LightFunctionQuality=0
r.ShadowQuality=0
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=256
r.Shadow.RadiusThreshold=0.12
r.Shadow.DistanceScale=0.3
r.Shadow.CSM.TransitionScale=0
r.DistanceFieldShadowing=0
[ShadowQuality@1]
r.LightFunctionQuality=0
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=512
r.Shadow.RadiusThreshold=0.08
r.Shadow.DistanceScale=0.45
r.Shadow.CSM.TransitionScale=0.5
r.DistanceFieldShadowing=0
[ShadowQuality@2]
r.LightFunctionQuality=0
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=512
r.Shadow.RadiusThreshold=0.06
r.Shadow.DistanceScale=0.55
r.Shadow.CSM.TransitionScale=0.8
r.DistanceFieldShadowing=0
[ShadowQuality@3]
r.LightFunctionQuality=1
r.ShadowQuality=4
r.Shadow.CSM.MaxCascades=3
r.Shadow.MaxResolution=1024
r.Shadow.RadiusThreshold=0.03
r.Shadow.DistanceScale=0.8
r.Shadow.CSM.TransitionScale=1.0
r.DistanceFieldShadowing=1

; ---------------------------------------------------------------------------
; Post process
; ---------------------------------------------------------------------------
[PostProcessQuality@0]
r.MotionBlurQuality=0
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.LightShaftQuality=0
r.SSR.Quality=0
r.AmbientOcclusionLevels=0
r.EyeAdaptationQuality=0
r.TonemapperQuality=0
[PostProcessQuality@1]
r.MotionBlurQuality=0
r.BloomQuality=2
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.LightShaftQuality=0
r.SSR.Quality=0
r.AmbientOcclusionLevels=0
r.EyeAdaptationQuality=1
r.TonemapperQuality=1
[PostProcessQuality@2]
r.MotionBlurQuality=0
r.BloomQuality=2
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.LightShaftQuality=0
r.SSR.Quality=0
r.AmbientOcclusionLevels=0
r.EyeAdaptationQuality=1
r.TonemapperQuality=1
[PostProcessQuality@3]
r.MotionBlurQuality=3
r.BloomQuality=4
r.DepthOfFieldQuality=2
r.LensFlareQuality=2
r.SceneColorFringeQuality=1
r.LightShaftQuality=1
r.SSR.Quality=3
r.AmbientOcclusionLevels=3
r.EyeAdaptationQuality=2
r.TonemapperQuality=4

; ---------------------------------------------------------------------------
; Textures
; ---------------------------------------------------------------------------
[TextureQuality@0]
r.Streaming.MipBias=2.5
r.MaxAnisotropy=0
r.Streaming.PoolSize=400
[TextureQuality@1]
r.Streaming.MipBias=1
r.MaxAnisotropy=2
r.Streaming.PoolSize=700
[TextureQuality@2]
r.Streaming.MipBias=0
r.MaxAnisotropy=4
r.Streaming.PoolSize=1024
[TextureQuality@3]
r.Streaming.MipBias=0
r.MaxAnisotropy=8
r.Streaming.PoolSize=1500

; ---------------------------------------------------------------------------
; Effects
; ---------------------------------------------------------------------------
[EffectsQuality@0]
r.TranslucencyLightingVolumeDim=24
r.RefractionQuality=0
r.SSR.Quality=0
r.SceneColorFormat=3
r.DetailMode=0
r.TranslucencyVolumeBlur=0
r.MaterialQualityLevel=0
r.ParticleLightQuality=0
[EffectsQuality@1]
r.TranslucencyLightingVolumeDim=24
r.RefractionQuality=0
r.SSR.Quality=0
r.SceneColorFormat=3
r.DetailMode=1
r.TranslucencyVolumeBlur=0
r.MaterialQualityLevel=1
r.ParticleLightQuality=0
[EffectsQuality@2]
r.TranslucencyLightingVolumeDim=24
r.RefractionQuality=0
r.SSR.Quality=0
r.SceneColorFormat=3
r.DetailMode=1
r.TranslucencyVolumeBlur=0
r.MaterialQualityLevel=1
r.ParticleLightQuality=0
[EffectsQuality@3]
r.TranslucencyLightingVolumeDim=64
r.RefractionQuality=2
r.SSR.Quality=3
r.SceneColorFormat=4
r.DetailMode=2
r.TranslucencyVolumeBlur=1
